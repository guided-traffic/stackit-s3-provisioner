# Default values for stackit-s3-provisioner.
#
# Every value, with its default, is listed once in ../../../README.md. The
# reasoning behind a setting — why it exists, what it costs, how to react when it
# misbehaves — lives under ../../../docs/operations/ and is linked per block.

# crds controls how the operator's CustomResourceDefinition (Bucket) is shipped.
# It is rendered from templates/, so it is applied on install AND upgrade, and it
# carries helm.sh/resource-policy: keep so `helm uninstall` cannot remove the type
# from under existing Bucket resources.
# Details: ../../../docs/operations/deployment.md
crds:
  # install renders the CRD as part of the release. false when CRDs are managed
  # out-of-band (GitOps, a separate cluster-admin pipeline) — nothing in the
  # release then creates or updates it.
  install: true

replicaCount: 1

image:
  repository: guidedtraffic/stackit-s3-provisioner
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# bucketRoles ships the user-facing ClusterRoles for Bucket CRs. The operator's
# own ClusterRole is unaffected by this block.
bucketRoles:
  # create renders the <release>-view and <release>-edit ClusterRoles, both
  # aggregation fragments for the built-in view/edit/admin roles. Set to false
  # when user RBAC is managed out-of-band.
  #
  # There is no switch to render -edit unaggregated: write access to a Bucket must
  # only ever be held together with Secret access in the same namespace, which is
  # what edit and admin guarantee. Do not bind -edit directly to a subject that
  # lacks Secret read/write in that namespace.
  # Reasoning: ../../../docs/security/rbac-and-privilege.md
  create: true

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# leaderElection guarantees that two operator VERSIONS never reconcile at once
# during a rolling update; it is not high availability. Keep it on: without a
# single leader the outgoing pod can re-apply a stale bucket policy over the one
# the new pod just wrote. Enabling it also renders the coordination.k8s.io/leases
# rule into the operator's ClusterRole.
# Details: ../../../docs/operations/configuration.md
leaderElection:
  enabled: true

# logging sets the verbosity of the operator's own log. info shows what the
# operator decides and what failed; debug adds the retry chatter underneath: a
# teardown held while the provider circuit is open, a status write that did not
# apply, clone and measurement progress. The format is not part of this key: the
# chart leaves the encoder at the operator's default, human-readable console
# lines.
# Details: ../../../docs/operations/configuration.md
logging:
  # level reaches the operator as the environment variable LOGLEVEL, so it can
  # also be changed with `kubectl set env` (which rolls the pod) without a Helm
  # upgrade. Accepted: debug, info, error, panic, or an integer above 0 selecting
  # a debug depth. There is NO warn; anything else is rejected at startup and
  # crash-loops the operator. An empty value fails the render: the operator would
  # read an empty LOGLEVEL as unset and fall back to its own default, debug.
  level: info

# driftResyncInterval is how often an already-provisioned Bucket is re-reconciled
# with no event to prompt it. It is what carries a policy change from a new
# operator version onto buckets whose CR nobody touched. Must be a Go duration
# string WITH A UNIT (e.g. "10m", "1h"); a bare number like 5 is rejected and
# crash-loops the operator at startup. Set to "0" to disable it and leave the
# operator purely event-driven.
# Details: ../../../docs/operations/configuration.md
driftResyncInterval: "10m"

# providerDegradedGrace is how long an already-provisioned Bucket keeps its Ready
# state while reconciles keep failing for a reason that says nothing about the
# bucket itself: the StackIT API unreachable, a gateway or WAF answering with an
# error page, a Kubernetes API blip. Ready then describes the last VERIFIED state
# rather than the outcome of the last attempt to verify it.
#
# While the hold is in effect, status.degradedSince and the ProviderReachable
# condition carry the degradation and the Warning events are unchanged; once the
# grace elapses the Bucket drops to Failed. Two cases are never held and fall
# immediately: a structured 400/401/403 from the provider, and a workload
# credential the operator itself destroyed.
#
# Must be a Go duration string WITH A UNIT (e.g. "30m", "1h"); a bare number is
# rejected and crash-loops the operator at startup. Set to "0" to disable the hold.
# What is held, what is not, and how to react: ../../../docs/operations/provider-outages.md
providerDegradedGrace: "30m"

# providerCircuit is the fleet-wide breaker over Bucket reconciles: a provider
# outage is a property of the provider, not of any one Bucket. After a run of
# reconciles that fail with no success in between, the operator stops calling the
# provider entirely, holds every Bucket and probes on a doubling cooldown until
# one succeeds. The failures are still logged, still raise Warning events and
# still land in status.message — they just stop being counted once per retry.
# Details: ../../../docs/operations/provider-outages.md
providerCircuit:
  # threshold is how many reconciles must fail back to back before the breaker
  # opens. Set to 0 to disable the breaker entirely.
  threshold: 3
  # maxCooldown caps the wait between provider probes while the circuit is open,
  # and therefore how long recovery lags behind the provider coming back. The wait
  # starts at 60s and doubles per failed probe up to this cap. Go duration string
  # WITH A UNIT; a cap below 60s is raised to 60s, a non-positive one falls back
  # to the default.
  maxCooldown: "5m"

# bucketNaming controls how the operator composes the physical StackIT bucket
# name from a Bucket CR. The rule is applied when a bucket is first provisioned
# and then frozen per CR: changing prefix or includeNamespace later only affects
# buckets created afterwards; existing buckets keep their original name.
#
# Example: prefix "my-cluster" + includeNamespace true turns a Bucket "my-bucket"
# in namespace "monitoring" into the physical bucket "my-cluster-monitoring-my-bucket".
# Details, including the 63-character budget: ../../../docs/operations/bucket-naming.md
bucketNaming:
  # prefix is prepended to every bucket name (e.g. a cluster identifier). Empty
  # disables the prefix. Must be a lowercase DNS-1123 label (letters, digits, '-';
  # no leading/trailing '-'). The composed name must stay within 63 characters or
  # the Bucket is rejected (Ready=Failed).
  prefix: ""
  # includeNamespace appends the Bucket's namespace to the name after the prefix.
  includeNamespace: false

# ownership controls the marker the operator writes into every provisioned
# bucket's tags to prove it owns them, so it never adopts or deletes a bucket that
# was created elsewhere (collision detection). STACKIT has no native bucket tags,
# so this rides on S3 bucket tagging.
ownership:
  # name is the operator/fleet identity written into each bucket's "managed-by"
  # tag. The operator only adopts or deletes a pre-existing bucket whose managed-by
  # matches this value AND whose "owner" tag matches the Bucket CR's namespace/name.
  # Allowed characters are those of an S3 tag value (letters, digits and
  # + - = . _ : / @ and spaces); nothing in the operator enforces this.
  #
  # WARNING: this value is part of the bucket ownership key. Changing it after
  # buckets exist makes the operator treat its own buckets as foreign (Ready=Failed
  # collision) until they are re-tagged, and an empty bucket is then released
  # without its cloud resources being deleted. On a disaster-recovery restore into
  # a new cluster, set the SAME value. Run two operators against the same StackIT
  # project only with DISTINCT values.
  # Consequences in full: ../../../docs/operations/bucket-naming.md
  name: stackit-s3-provisioner

# wipeOnDelete globally gates the destructive wipe feature (spec.wipeOnDelete on
# a Bucket CR: delete ALL objects, including versions and delete markers, before
# removing the bucket on CR deletion).
# Details: ../../../docs/operations/deletion.md
wipeOnDelete:
  # enabled turns the feature gate on. Opt-in, default off. While it is off, a
  # Bucket requesting a wipe is degraded to the safe default (delete only if
  # empty) and a warning event is emitted — the CR field is effectively ignored.
  enabled: false

# clone configures the one-shot bucket-clone feature (spec.cloneFrom on a
# Bucket CR: copy the contents of an existing S3 bucket into the freshly
# provisioned one). The copy runs as a Kubernetes Job (rclone) in the operator's
# namespace; the operator polls rclone's remote-control API for transfer progress
# and surfaces it in the Bucket's status.
# Details: ../../../docs/operations/cloning.md
clone:
  # image is the rclone image run by clone Jobs. Renovate tracks the tag.
  image:
    repository: rclone/rclone
    tag: "1.75.0"
  # resources applied to clone Job pods. Copying is network-bound; raise the
  # limits for very large transfers.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # networkPolicy restricts ingress to clone Job pods so only the operator can
  # reach the (basic-auth protected) rclone remote-control port. Disable on
  # clusters without a NetworkPolicy-capable CNI, where the resource would be
  # silently ignored anyway.
  networkPolicy:
    enabled: true

# bucketUsage controls the periodic bucket-size measurement and the monthly cost
# estimate derived from it. The measured size, the object count and the estimate
# are written to each Bucket's status (status.usage) and shown as CR columns, so
# they are visible in kubectl and Lens; every value is also exported as a metric
# for alerting.
#
# Measuring costs no money at STACKIT, but it costs TIME: the only way to obtain a
# size is to list the bucket, roughly one request per 1000 object keys. That is
# what minInterval and maxObjects below bound.
# Details: ../../../docs/operations/usage-and-cost.md
bucketUsage:
  # enabled is the HARD gate. false means the operator measures nothing at all,
  # whatever any Bucket asks for (a Bucket that asked explicitly gets a warning
  # event and a note in status). Flip it to stop all measurement traffic at once
  # without touching a single CR.
  enabled: true
  # defaultEnabled applies to every Bucket that does not set spec.usage.enabled
  # itself. This is the cluster-wide policy and it is OFF, so measurement is
  # something a workload opts into; a Bucket can override it in either direction
  # while `enabled` above is true.
  defaultEnabled: false
  # interval is how often a Bucket that does not request its own interval is
  # measured. Must be a Go duration string WITH A UNIT (e.g. "1h", "6h"); a bare
  # number like 60 is rejected and crash-loops the operator at startup.
  interval: "60m"
  # minInterval is the floor for spec.usage.interval: a Bucket asking to be
  # measured more often is clamped up to this and told so in status and via a
  # warning event. Same duration format as above.
  minInterval: "60m"
  # maxObjects caps how many listing entries ONE measurement consumes. Beyond it
  # the pass stops and reports a LOWER BOUND: status.usage.truncated becomes
  # true, and the size and cost columns are prefixed with ">=". A bucket that
  # regularly exceeds the cap never reports a true size and its cost estimate is
  # too low; raising the cap makes the pass proportionally longer, not more
  # expensive. Set to 0 to remove the cap entirely (unbounded listing).
  maxObjects: 2000000
  # includeVersions counts non-current object versions and delete markers. They
  # occupy billed storage but do not appear in a plain object listing, so on a
  # VERSIONED bucket the default (false) understates both the size and the cost.
  # Individual Buckets can override this with spec.usage.includeVersions.
  includeVersions: false
  # concurrency is how many buckets are measured in parallel. Measurement runs in
  # its own controller with its own work queue, so this bounds how much listing
  # traffic the operator produces at once and never delays provisioning.
  concurrency: 2
  # pricing turns a measured size into the monthly cost estimate shown on the CR
  # and exported as a metric.
  pricing:
    # perGBHour is the price of ONE GIGABYTE for ONE HOUR in whole currency
    # units, QUOTED AS A STRING so YAML does not turn it into an exponent.
    #
    # The default is the STACKIT list price for Object Storage Premium-EU01, net,
    # excluding taxes. If you have a contract, put YOUR price here — nothing
    # verifies this number. Set to "" or "0" to switch the estimate off entirely.
    perGBHour: "0.00003697772"
    # currency labels the estimate on the CR and as a metric label. Display only:
    # no conversion of any kind happens, so changing it does not change a number.
    currency: "EUR"

# monitoring integrates the operator with a prometheus-operator stack. Both
# resources below use prometheus-operator CRDs (monitoring.coreos.com/v1) —
# enable them only on clusters where those CRDs exist, or the install fails.
# Details: ../../../docs/operations/monitoring.md
monitoring:
  # serviceMonitor scrapes the operator's metrics endpoint (:8080). Enabling it
  # also renders the metrics Service the ServiceMonitor selects.
  serviceMonitor:
    enabled: false
    # interval between scrapes (Prometheus duration).
    interval: 30s
    # scrapeTimeout per scrape; empty uses the Prometheus default.
    scrapeTimeout: ""
    # labels are added to the ServiceMonitor, e.g. the `release: <name>` label
    # many kube-prometheus-stack installs require for discovery. Without the label
    # the object is created, is valid, and is silently never read.
    labels: {}
  # prometheusRule ships the operator's alerting rules. Every alert can be
  # switched off individually; all default to enabled except bucketRecreated,
  # which ships off. The resource is only rendered when enabled is true AND at
  # least one alert is enabled.
  prometheusRule:
    enabled: false
    # labels are added to the PrometheusRule, e.g. `release: <name>` — the same
    # discovery selector as above.
    labels: {}
    # What each alert means, the `for` window it waits out, the rendered
    # expression behind it and what to do when it fires:
    # ../../../docs/operations/monitoring.md
    alerts:
      # bucketsWipeOnDelete fires (warning) while at least one Bucket CR
      # carries spec.wipeOnDelete=true — deleting such a CR irreversibly
      # wipes all objects in its bucket.
      bucketsWipeOnDelete:
        enabled: true
      # bucketFailed fires (warning) while any Bucket is in phase Failed.
      # Config faults deliberately park without requeue-hammering, so without
      # this alert nobody notices them.
      bucketFailed:
        enabled: true
      # bucketStuckProvisioning fires (warning) when Buckets sit in phase
      # Pending/Provisioning for 30m (StackIT API down, quota, network).
      bucketStuckProvisioning:
        enabled: true
      # bucketStuckDeleting fires (warning) when a finalizer teardown hangs for
      # 30m — usually the non-empty-bucket data-loss guard blocking deletion.
      bucketStuckDeleting:
        enabled: true
      # cloneFailed fires (warning) when a bucket clone stays Failed for 30m
      # (dead source credentials, vanished source bucket).
      cloneFailed:
        enabled: true
      # skeletonMode fires (critical) while the operator runs without a StackIT
      # service-account key: probes stay green but nothing is provisioned.
      skeletonMode:
        enabled: true
      # wipeRequestedButGateDisabled fires (warning) when Buckets request
      # spec.wipeOnDelete but the operator-wide feature gate is off — deletion
      # would silently degrade to the empty-only guard.
      wipeRequestedButGateDisabled:
        enabled: true
      # reconcileErrors fires (warning) on sustained reconcile errors
      # (controller-runtime's built-in error counter). A fleet-wide outage trips
      # providerCircuit and is reported by bucketProviderDegraded instead, so what
      # reaches this alert is errors the breaker did not absorb.
      reconcileErrors:
        enabled: true
        # threshold is the error count within a 15m window that counts as a
        # problem. Keep it above the cost of a single tripped circuit
        # (providerCircuit.threshold minus one error), or two unrelated outages in
        # one window will page.
        threshold: 6
        # sustainedFor is how long the threshold must be exceeded continuously,
        # on top of the rule's own 15m increase() window.
        sustainedFor: "15m"
        # suppressWhileCircuitOpen drops every 15m window in which the provider
        # circuit breaker was open at any point, so a StackIT outage cannot reach
        # this alert at all — it is reported by StackitS3BucketProviderDegraded.
        # Fail-open by construction: with the circuit metric missing, nothing is
        # dropped and the alert behaves as it did before.
        suppressWhileCircuitOpen: true
      # bucketProviderDegraded fires (warning) when a Bucket's Ready state has
      # been HELD through non-definitive reconcile failures for longer than
      # holdForSeconds. Ready still reports True, so without this alert the hold
      # is invisible until the grace elapses and the Bucket drops to Failed.
      bucketProviderDegraded:
        enabled: true
        # holdForSeconds must sit below providerDegradedGrace, or the alert can
        # never fire: once the grace elapses the Bucket drops to Failed, the
        # degraded series disappears and StackitS3BucketFailed takes over.
        # 1200s = 20m, leaving 10m of the default 30m grace to react.
        holdForSeconds: 1200
      # bucketMissing fires (critical) when a Bucket that was provisioned finds
      # its bucket gone from the provider. That is data loss, not an outage: the
      # operator refuses to re-create the bucket, so the Bucket parks in Failed
      # with reason BucketMissing rather than quietly handing the workload an
      # empty bucket under the same name. Only the provider's own structured
      # answer reaches this alert; an unreachable API is bucketProviderDegraded.
      bucketMissing:
        enabled: true
      # bucketRecreated fires (warning) when a Bucket with spec.allowRecreate
      # had its vanished bucket rebuilt automatically. The rebuild is authorised,
      # the data loss behind it is not any less real, and the workload needs a
      # restart to pick up its replaced credentials Secret.
      #
      # Off by default, unlike every other alert here: it can only ever fire on a
      # deployment that actually uses spec.allowRecreate, so it is switched on
      # deliberately by whoever adopts that opt-in rather than shipped to
      # everyone. Turn it on together with the first Bucket that sets the field —
      # an unattended re-creation leaves no durable trace on the CR, so this
      # counter and the Warning event are the only records that it happened.
      bucketRecreated:
        enabled: false
        # window is the lookback for increase(); it bounds how long after an
        # unattended re-creation the alert can still fire, so it must outlast the
        # time somebody needs to notice. The counter is a process counter and
        # restarts at zero with the operator.
        window: "6h"
      # usageMeasurementFailing fires (warning) when bucket size measurements
      # keep failing. Measurement failures deliberately do NOT mark a Bucket
      # unhealthy — the bucket itself is fine, only its size is unknown — so
      # without this alert a permanently stale size and cost estimate is silent.
      usageMeasurementFailing:
        enabled: true
      # usageMeasurementTruncated fires (warning) while a Bucket keeps hitting
      # bucketUsage.maxObjects. Its reported size and cost are then lower bounds,
      # which is exactly the state in which a size-based alert under-reports.
      usageMeasurementTruncated:
        enabled: true
      # saKeyReloadFailing fires (warning) while the operator keeps REJECTING the
      # service-account key on disk: it does not parse, it names a different
      # StackIT project, or the provider will not mint a token with it. Nothing
      # is broken yet — the operator carries on with the key it already holds —
      # and that is precisely the danger: a rotation that silently failed is
      # indistinguishable from a healthy operator until the old key expires.
      saKeyReloadFailing:
        enabled: true
      # saKeyExpiring fires (warning) when the key in use runs out within
      # leadTimeDays. The remaining lifetime is computed in the rule from the
      # key's own validUntil, which STACKIT sets 90 days after issue.
      #
      # The series is ABSENT for a key file that carries no validUntil, so this
      # alert then never fires at all rather than failing loudly. If your keys
      # have no expiry stamped into them, this alert gives you nothing and the
      # rotation deadline has to be tracked elsewhere.
      saKeyExpiring:
        enabled: true
        # leadTimeDays is how far ahead of expiry the warning starts. It has to
        # outlast the slowest rotation path you actually have, issuing the new
        # key included. Must stay an integer.
        leadTimeDays: 14
      # saKeyExpiringCritical is the same measurement at a shorter lead time and
      # critical severity: at this point the rotation has to happen now, or every
      # Bucket in the cluster drops to Failed the moment the key dies.
      saKeyExpiringCritical:
        enabled: true
        # leadTimeDays as above, and well below saKeyExpiring.leadTimeDays. Both
        # alerts fire below this threshold; route them apart by severity.
        leadTimeDays: 3

# stackit configures the operator's binding to a StackIT project.
stackit:
  # region is the StackIT region the operator provisions buckets in.
  region: eu01
  # serviceAccountKey references an existing Secret holding the StackIT
  # service-account key JSON (key flow, embedded RSA private key).
  # Leave secretName empty to run the operator in skeleton mode (no provisioning).
  serviceAccountKey:
    secretName: ""
    secretKey: sa-key.json
    # reloadInterval is how often the operator re-reads the mounted key file and,
    # when the content has changed, proves the new key before putting it to work.
    #
    # This is the ONLY input the operator picks up without a pod restart, because
    # it is the only one an external rotation changes without touching this chart.
    # The full window is longer than the interval: kubelet itself needs up to
    # about 90 seconds to refresh a Secret volume inside the container, and after
    # a successful swap the fleet recovers within one driftResyncInterval.
    #
    # A candidate that does not parse, names a different StackIT project, or
    # cannot mint a token is REJECTED and the running key is kept — which is what
    # stops a truncated write or an already-revoked key from taking down a healthy
    # operator. A rotation that is being rejected looks exactly like a healthy
    # operator until the old key expires, so watch the saKeyReloadFailing and
    # saKeyExpiring alerts below.
    #
    # Must be a Go duration string WITH A UNIT (e.g. "30s", "2m"); a bare number
    # like 30 is rejected and crash-loops the operator at startup. Set to "0" to
    # switch the reload off and restore the restart-only behaviour exactly; none
    # of the sa_key metrics is then exported.
    # Details: ../../../docs/operations/credentials.md
    reloadInterval: "30s"
