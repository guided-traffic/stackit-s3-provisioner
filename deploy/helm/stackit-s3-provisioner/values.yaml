# Default values for stackit-s3-provisioner.

# crds controls how the operator's CustomResourceDefinition (Bucket) is shipped.
# The CRD lives in templates/, so it is applied on every install AND upgrade.
# It carries helm.sh/resource-policy: keep, so `helm uninstall` leaves the CRD
# and all existing Bucket resources intact (no finalizer bypass / leaked cloud
# resources); remove it manually with `kubectl delete crd` if truly desired.
crds:
  # install renders the CRD as part of the chart. Set to false when CRDs are
  # managed out-of-band (e.g. GitOps / a separate cluster-admin pipeline).
  install: true

replicaCount: 1

image:
  repository: guidedtraffic/stackit-s3-provisioner
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# leaderElection ensures only one operator instance reconciles at a time. Keep it
# ON: during a rolling update the new pod starts before the old one terminates,
# and without a single leader BOTH reconcile concurrently — an older version can
# then re-apply a stale bucket policy after the new one wrote the correct one
# (observed: multipart policy fix not reaching an existing bucket after upgrade).
# Once both the outgoing and incoming pods run leader election, the incoming pod
# waits for the lease before it reconciles, so there is no concurrent write — this
# protects every future rollout. NOTE: the ONE rollout that first enables this
# (false->true) still has an outgoing pod that predates leader election and keeps
# reconciling freely, so that single upgrade can still race once; the periodic
# driftResyncInterval below is what heals any stale policy left behind. Enabling
# this also grants the operator the coordination.k8s.io/leases RBAC (clusterrole.yaml).
leaderElection:
  enabled: true

# driftResyncInterval makes the operator periodically re-reconcile every
# provisioned Bucket so configuration drift — most importantly the per-bucket
# isolation policy — self-heals without an event. This matters on operator
# upgrades: the Bucket watch only fires on generation/annotation changes, so a
# policy change shipped in a new version would otherwise not reach
# already-provisioned buckets until their CR is touched. Must be a Go duration
# string WITH A UNIT (e.g. "10m", "1h", "30s"); a bare number like 5 is rejected
# and crash-loops the operator at startup. Set to "0" to disable and rely on
# events only.
driftResyncInterval: "10m"

# providerDegradedGrace controls how long an already-provisioned Bucket keeps its
# Ready state while reconciles keep failing for a reason that says nothing about
# the bucket itself: the StackIT API unreachable, a gateway or WAF answering with
# an error page, a Kubernetes API blip. Ready then describes the last VERIFIED
# state of the bucket rather than the outcome of the last attempt to verify it.
#
# Why this exists: without it, a single failed control-plane call flips a healthy
# Bucket to Failed on the spot. A two-minute provider blip therefore marked every
# Bucket on the cluster non-ready at once, which cascaded into every Flux
# Kustomization health-checking them and produced a cluster-wide alert storm.
#
# The hold is bounded, so a real outage still surfaces — only later. Once the
# grace elapses the Bucket drops to Failed exactly as before. While it is held,
# status.degradedSince and the ProviderReachable condition carry the degradation
# and the Warning events are unchanged.
#
# Reconcile errors are NOT emitted once per retry any more: providerCircuit below
# takes over the retry schedule during a fleet-wide outage, so
# controller_runtime_reconcile_errors_total counts the outage rather than the
# retries. The signal while a hold is in effect is
# stackit_s3_provisioner_bucket_degraded_since_timestamp_seconds and the
# StackitS3BucketProviderDegraded alert, which fires once the hold has lasted
# long enough that the drop to Failed is close.
#
# NOT held (these drop Ready immediately, whatever the grace):
#   - A structured 400/401/403 from the provider. 401/403 is the Object Storage
#     API refusing an authenticated request; 400 is how a REVOKED service-account
#     key surfaces — the key flow never reaches the API at all and the token
#     endpoint answers 400 invalid_grant (measured live 2026-08-25). A gateway
#     error page carrying any of those codes is told apart by its body (not valid
#     JSON) and is still held.
#   - A workload credential the operator itself destroyed: the old access key was
#     deleted and the replacement could not be published. That is local certainty
#     that the Secret is dead, not an unverifiable provider state.
#
# Must be a Go duration string WITH A UNIT (e.g. "30m", "1h"); a bare number is
# rejected and crash-loops the operator at startup. Set to "0" to disable the
# hold and restore the previous behavior without deploying a different image.
providerDegradedGrace: "30m"

# providerCircuit is the fleet-wide breaker over Bucket reconciles.
#
# Why this exists: a provider outage is a property of the provider, not of any
# one Bucket. While the StackIT API answers 503, reconciling the seventeenth
# Bucket cannot succeed, and attempting it costs API calls that make the outage
# worse. Measured on mgmt-p on 2026-09-02: a provider-side 503 storm at 14:23
# drove the operator into "rate limit on IP level exceeded" by 14:34 and into 51
# rate-limited requests per minute by 14:42 — by the end, most of the load on the
# failing endpoint was the operator's own retries. One outage that resolved on its
# own produced 242 reconcile errors and paged twice.
#
# With the breaker, that outage costs a handful of API calls: after `threshold`
# reconciles fail back to back the operator stops calling the provider entirely,
# holds every Bucket, and probes on a doubling cooldown until one succeeds. The
# failures are still logged, still raise Warning events and still land in
# status.message — they just stop being counted once per retry.
#
# What distinguishes an outage from one broken Bucket is the ABSENCE of any
# successful reconcile in between, not a classification of the error. A single
# failing Bucket among healthy ones has its failures interleaved with the
# successes of the rest of the fleet, which resets the run, so it keeps reporting
# its own error and never holds anyone else.
#
# Observability while open: stackit_s3_provisioner_provider_circuit_open and
# stackit_s3_provisioner_provider_circuit_opened_timestamp_seconds.
providerCircuit:
  # threshold is how many reconciles must fail back to back before the breaker
  # opens. Set to 0 to disable the breaker entirely, which restores the previous
  # behavior without deploying a different image.
  threshold: 3
  # maxCooldown caps the wait between provider probes while the circuit is open,
  # and therefore how long recovery lags behind the provider coming back. The
  # wait starts at 60s and doubles per failed probe up to this cap.
  #
  # 60s rather than less because the open state has to be OBSERVABLE, not just
  # effective: monitoring.serviceMonitor.interval is 30s, and the
  # StackitS3ReconcileErrors alert below suppresses itself for windows in which
  # the circuit was open, so a trip must outlive a scrape gap to be seen.
  # Go duration string WITH A UNIT.
  maxCooldown: "5m"

# bucketNaming controls how the operator composes the physical StackIT bucket
# name from a Bucket CR. The rule is applied when a bucket is first provisioned
# and then frozen per CR (recorded in status + an annotation): changing prefix or
# includeNamespace later only affects buckets created afterwards; existing buckets
# keep their original name.
#
# Example: prefix "my-cluster" + includeNamespace true turns a Bucket "my-bucket"
# in namespace "monitoring" into the physical bucket "my-cluster-monitoring-my-bucket".
bucketNaming:
  # prefix is prepended to every bucket name (e.g. a cluster identifier). Empty
  # disables the prefix. Must be a lowercase DNS-1123 label (letters, digits, '-';
  # no leading/trailing '-'). The composed name must stay within 63 characters or
  # the Bucket is rejected (Ready=Failed).
  prefix: ""
  # includeNamespace appends the Bucket's namespace to the name after the prefix.
  includeNamespace: false

# ownership controls the marker the operator writes into every provisioned
# bucket's tags to prove it owns them, so it never adopts or deletes a bucket that
# was created elsewhere (collision detection). STACKIT has no native bucket tags,
# so this rides on S3 bucket tagging.
ownership:
  # name is the operator/fleet identity written into each bucket's "managed-by"
  # tag. The operator only adopts or deletes a pre-existing bucket whose managed-by
  # matches this value AND whose "owner" tag matches the Bucket CR's namespace/name.
  #
  # WARNING: this value is part of the bucket ownership key. Changing it after
  # buckets exist makes the operator treat its own buckets as foreign (Ready=Failed
  # collision) until they are re-tagged. On a disaster-recovery restore into a new
  # cluster, set the SAME value so the operator re-adopts its buckets.
  #
  # Run two operators against the same StackIT project only with DISTINCT values
  # (otherwise they fight over the same buckets). Allowed characters follow S3 tag
  # values: letters, digits and + - = . _ : / @ and spaces.
  name: stackit-s3-provisioner

# wipeOnDelete globally gates the destructive wipe feature (spec.wipeOnDelete on
# a Bucket CR: delete ALL objects, including versions and delete markers, before
# removing the bucket on CR deletion). When disabled, a Bucket requesting a wipe
# is degraded to the safe default (delete only if empty) and a warning event is
# emitted — the CR field is effectively ignored.
wipeOnDelete:
  # enabled turns the feature gate on. Opt-in, default off.
  enabled: false

# clone configures the one-shot bucket-clone feature (spec.cloneFrom on a
# Bucket CR: copy the contents of an existing S3 bucket into the freshly
# provisioned one). The copy runs as a Kubernetes Job (rclone) in the
# operator's namespace; the operator polls rclone's remote-control API for
# transfer progress and surfaces it in the Bucket's status.
clone:
  # image is the rclone image run by clone Jobs. Renovate tracks the tag.
  image:
    repository: rclone/rclone
    tag: "1.75.0"
  # resources applied to clone Job pods. Copying is network-bound; raise the
  # limits for very large transfers.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # networkPolicy restricts ingress to clone Job pods so only the operator can
  # reach the (basic-auth protected) rclone remote-control port. Disable on
  # clusters without a NetworkPolicy-capable CNI, where the resource would be
  # silently ignored anyway.
  networkPolicy:
    enabled: true

# bucketUsage controls the periodic bucket-size measurement and the monthly cost
# estimate derived from it. The measured size, the object count and the estimate
# are written to each Bucket's status (status.usage) and shown as CR columns, so
# they are visible in kubectl and Lens; every value is also exported as a metric
# for alerting.
#
# WHAT IT COSTS. STACKIT bills Object Storage per started gigabyte per started
# hour and its price list has NO request, operation or traffic component, so
# measuring costs no money (verified against the STACKIT price list v1.0.43 and
# the Object Storage Leistungsschein v1.2, see INIT-SETUP.md 8.3). It costs TIME:
# the control-plane API exposes no usage endpoint, so the only way to obtain a
# size is to list the bucket — roughly one request per 1000 object keys. A bucket
# with 2 million objects is about 2000 requests per pass, every pass. That is why
# minInterval and maxObjects exist; lower the interval only after looking at
# status.usage.measurementDuration on a real bucket.
bucketUsage:
  # enabled is the HARD gate. false means the operator measures nothing at all,
  # whatever any Bucket asks for (a Bucket that asked explicitly gets a warning
  # event and a note in status). Flip it to stop all measurement traffic at once
  # without touching a single CR.
  enabled: true
  # defaultEnabled applies to every Bucket that does not set spec.usage.enabled
  # itself. This is the cluster-wide policy and it is OFF, so measurement is
  # something a workload opts into; a Bucket can override it in either direction
  # while `enabled` above is true.
  defaultEnabled: false
  # interval is how often a Bucket that does not request its own interval is
  # measured. Must be a Go duration string WITH A UNIT (e.g. "1h", "6h"); a bare
  # number like 60 is rejected and crash-loops the operator at startup.
  interval: "60m"
  # minInterval is the floor for spec.usage.interval: a Bucket asking to be
  # measured more often is clamped up to this and told so in status and via a
  # warning event. It is the guard against a single CR generating continuous
  # listing traffic for the whole project.
  minInterval: "60m"
  # maxObjects caps how many listing entries ONE measurement consumes. Beyond it
  # the pass stops and reports a LOWER BOUND: status.usage.truncated becomes
  # true, and the size and cost columns are prefixed with ">=". This bounds the
  # time a single pass can take on a bucket with very many objects.
  #
  # WARNING: a bucket that regularly exceeds this cap never reports a true size,
  # and its cost estimate is therefore too low. Watch the warning event
  # UsageMeasurementTruncated and raise the cap deliberately — the pass gets
  # proportionally longer, not more expensive.
  # Set to 0 to remove the cap entirely (unbounded listing).
  maxObjects: 2000000
  # includeVersions counts non-current object versions and delete markers by
  # default. They occupy billed storage but do not appear in a plain object
  # listing, so on a VERSIONED bucket the default (false) understates both the
  # size and the cost. Enabling it makes the measurement match the invoice at the
  # price of listing every version instead of every current object. Individual
  # Buckets can override this with spec.usage.includeVersions.
  includeVersions: false
  # concurrency is how many buckets are measured in parallel. Measurement runs in
  # its own controller with its own work queue, so a slow measurement never
  # delays provisioning — this value only bounds how much listing traffic the
  # operator produces at once.
  concurrency: 2
  # pricing turns a measured size into the monthly cost estimate shown on the CR
  # (status.usage.estimatedMonthlyCost, column "Cost/Month") and exported as
  # stackit_s3_provisioner_bucket_estimated_monthly_cost.
  pricing:
    # perGBHour is the price of ONE GIGABYTE for ONE HOUR in whole currency
    # units, QUOTED AS A STRING so YAML does not turn it into an exponent.
    #
    # The default is the STACKIT list price for Object Storage Premium-EU01 from
    # the public price list (version 1.0.43, 08/04/2026), net, excluding taxes.
    # EU02 (Austria) was 0.00003883000 in the same list. These are LIST prices:
    # if you have a contract, put YOUR price here — nothing verifies this number.
    # Set to "" or "0" to switch the estimate off entirely.
    perGBHour: "0.00003697772"
    # currency labels the estimate on the CR and as a metric label. Display only:
    # no conversion of any kind happens, so changing it does not change a number.
    currency: "EUR"
    # NOTE on how the estimate is computed, because it is an ESTIMATE and not an
    # invoice: the measured size is rounded UP to a whole decimal gigabyte (the
    # billing metric is per STARTED gigabyte), priced for 720 hours (the 30-day
    # month STACKIT's own price list projects with) and rounded to whole cents.
    # It prices the size measured at ONE moment as if it were held all month, and
    # it covers storage only.

# monitoring integrates the operator with a prometheus-operator stack. Both
# resources below use prometheus-operator CRDs (monitoring.coreos.com/v1) —
# enable them only on clusters where those CRDs exist, or the install fails.
monitoring:
  # serviceMonitor scrapes the operator's metrics endpoint (:8080). Enabling it
  # also renders the metrics Service the ServiceMonitor selects.
  serviceMonitor:
    enabled: false
    # interval between scrapes (Prometheus duration).
    interval: 30s
    # scrapeTimeout per scrape; empty uses the Prometheus default.
    scrapeTimeout: ""
    # labels are added to the ServiceMonitor, e.g. the `release: <name>` label
    # many kube-prometheus-stack installs require for discovery.
    labels: {}
  # prometheusRule ships the operator's alerting rules. Every alert can be
  # switched off individually; all alerts default to enabled. The resource is
  # only rendered when enabled is true AND at least one alert is enabled.
  prometheusRule:
    enabled: false
    # labels are added to the PrometheusRule, e.g. `release: <name>`.
    labels: {}
    alerts:
      # bucketsWipeOnDelete fires (warning) while at least one Bucket CR
      # carries spec.wipeOnDelete=true — deleting such a CR irreversibly
      # wipes all objects in its bucket.
      bucketsWipeOnDelete:
        enabled: true
      # bucketFailed fires (warning) while any Bucket is in phase Failed.
      # Config faults deliberately park without requeue-hammering, so without
      # this alert nobody notices them.
      bucketFailed:
        enabled: true
      # bucketStuckProvisioning fires (warning) when Buckets sit in phase
      # Pending/Provisioning for 30m (StackIT API down, quota, network).
      bucketStuckProvisioning:
        enabled: true
      # bucketStuckDeleting fires (warning) when a finalizer teardown hangs for
      # 30m — usually the non-empty-bucket data-loss guard blocking deletion.
      bucketStuckDeleting:
        enabled: true
      # cloneFailed fires (warning) when a bucket clone stays Failed for 30m
      # (dead source credentials, vanished source bucket).
      cloneFailed:
        enabled: true
      # skeletonMode fires (critical) while the operator runs without a StackIT
      # service-account key: probes stay green but nothing is provisioned.
      skeletonMode:
        enabled: true
      # wipeRequestedButGateDisabled fires (warning) when Buckets request
      # spec.wipeOnDelete but the operator-wide feature gate is off — deletion
      # would silently degrade to the empty-only guard.
      wipeRequestedButGateDisabled:
        enabled: true
      # reconcileErrors fires (warning) on sustained reconcile errors
      # (controller-runtime's built-in error counter).
      #
      # It deliberately no longer fires on a burst. A fleet-wide provider outage
      # trips providerCircuit after a few failures and then stops producing
      # errors at all, so what reaches this alert is errors the breaker did not
      # absorb — a persistent problem rather than a provider blip that resolves
      # on its own. Before the breaker, one such blip on mgmt-p produced 242
      # errors and paged twice for something nobody could act on.
      reconcileErrors:
        enabled: true
        # threshold is the error count within a 15m window that counts as a
        # problem. One tripped circuit costs providerCircuit.threshold errors, so
        # keep this above that or two unrelated outages in one window will page.
        threshold: 6
        # sustainedFor is how long the threshold must be exceeded continuously.
        # Because the expression is a 15m increase, a burst decays below the
        # threshold within 15m of stopping and never satisfies this.
        sustainedFor: "15m"
        # suppressWhileCircuitOpen drops every 15m window in which the provider
        # circuit breaker was open at any point, so a StackIT outage cannot reach
        # this alert at all: it is reported by StackitS3BucketProviderDegraded
        # once the hold has lasted long enough to matter, which is the point at
        # which there is something to do. What is left here is errors the breaker
        # never recognised as a provider outage.
        #
        # Fail-open by construction: if the circuit metric is missing (an operator
        # older than this chart, or providerCircuit.threshold=0 on a version that
        # does not export it), the `unless` clause removes nothing and the alert
        # behaves as it did before. A scrape interval coarser than 60s can also
        # miss a single short trip, with the same fail-open result.
        suppressWhileCircuitOpen: true
      # bucketProviderDegraded fires (warning) when a Bucket's Ready state has
      # been HELD through non-definitive reconcile failures for longer than
      # holdForSeconds. Ready still reports True, so without this alert the hold
      # is invisible until the grace elapses and the Bucket drops to Failed.
      #
      # It alerts on the AGE of the hold, not on its existence: a provider blip
      # that resolves inside the window is exactly what the hold is for and is
      # not worth waking anyone. Reaching the window means the drop to Failed is
      # close and there is still time to act.
      bucketProviderDegraded:
        enabled: true
        # holdForSeconds must sit below providerDegradedGrace, or the alert can
        # never fire: once the grace elapses the Bucket drops to Failed, the
        # degraded series disappears and StackitS3BucketFailed takes over.
        # 1200s = 20m, leaving 10m of the default 30m grace to react.
        holdForSeconds: 1200
      # usageMeasurementFailing fires (warning) when bucket size measurements
      # keep failing. Measurement failures deliberately do NOT mark a Bucket
      # unhealthy — the bucket itself is fine, only its size is unknown — so
      # without this alert a permanently stale size and cost estimate is silent.
      usageMeasurementFailing:
        enabled: true
      # usageMeasurementTruncated fires (warning) while a Bucket keeps hitting
      # bucketUsage.maxObjects. Its reported size and cost are then lower bounds,
      # which is exactly the state in which a size-based alert under-reports.
      usageMeasurementTruncated:
        enabled: true

# stackit configures the operator's binding to a StackIT project.
stackit:
  # region is the StackIT region the operator provisions buckets in.
  region: eu01
  # serviceAccountKey references an existing Secret holding the StackIT
  # service-account key JSON (key flow, embedded RSA private key).
  # Leave secretName empty to run the operator in skeleton mode (no provisioning).
  serviceAccountKey:
    secretName: ""
    secretKey: sa-key.json
