name: Renovate Application
on:
  # Run daily at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Berlin"
  # After each push to main
  # push:
  #   branches:
  #     - main
  # Manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # GitHub App installation token (guided-traffic-automation), scoped to this
      # repository with all permissions of the app; expires after 1 h and is
      # revoked at the end of the job.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/stackit-s3-provisioner'
          RENOVATE_REQUIRE_CONFIG: 'required'
